server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Cut blocks small and often so they're flushed to disk instead of held in memory.
# The defaults (500 MB or 30 minutes) are larger than the container's 384 MB limit.
ingester:
  max_block_bytes: 52428800      # 50 MB
  max_block_duration: 5m
  trace_idle_period: 10s

compactor:
  compaction:
    block_retention: 48h

# Derives RED metrics and the service graph from spans and pushes them to Prometheus
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      # local-blocks (TraceQL metrics queries) is left out: it keeps a second in-memory copy of
      # recent traces, and the dashboards use span-metrics in Prometheus instead
      processors: [service-graphs, span-metrics]
