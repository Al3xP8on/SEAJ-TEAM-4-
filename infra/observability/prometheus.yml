global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Application metrics sent to the collector over OTLP
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Kafka consumer lag, topic offsets
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Health of the monitoring stack itself
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
