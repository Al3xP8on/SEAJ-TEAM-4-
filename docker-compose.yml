services:
  db:
    build:
      context: ./infra/db
      dockerfile: Dockerfile
    container_name: seaj_postgres_db
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata_volume:/var/lib/postgresql/data

  app:
    build:
      context: app/backend/backend-java
      dockerfile: Dockerfile
    container_name: seaj_app
    ports:
      - "8081:8083"
    depends_on:
      - db
      - auth-service
    environment:
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      JWT_SHARED_SECRET: "${JWT_SECRET}"

  auth-service:
    build:
      context: app/backend/backend-nestjs
      dockerfile: Dockerfile
    container_name: seaj_auth_service
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRY: "${JWT_EXPIRY}"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      DB_NAME: "${POSTGRES_DB}"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: seaj_kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${REMOTE_HOST:-localhost}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: seaj_kafka_ui
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  execution-engine:
    build:
      context: execution-engine
      dockerfile: Dockerfile
    container_name: seaj_execution_engine
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENGINE_MIN_DELAY: "${ENGINE_MIN_DELAY:-500ms}"
      ENGINE_MAX_DELAY: "${ENGINE_MAX_DELAY:-2000ms}"
      ENGINE_MAX_PRICE_IMPROVEMENT_BPS: "${ENGINE_MAX_PRICE_IMPROVEMENT_BPS:-50}"

  sonarqube:
    image: sonarqube:9.9-community
    container_name: seaj_sonarqube
    ports:
      - "8088:9000" 
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - sonar.search.javaAdditionalOpts=-Xmx512m -Xms512m -XX:MaxDirectMemorySize=256m
      - ES_JAVA_OPTS=-Des.cluster.routing.allocation.disk.watermark.low=97% -Des.cluster.routing.allocation.disk.watermark.high=98% -Des.cluster.routing.allocation.disk.watermark.flood_stage=99%
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: seaj_otel_collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (services running outside Docker)
      - "4318:4318"   # OTLP HTTP (browser / Angular)
    depends_on:
      - tempo
      - loki

  # Tempo runs as uid 10001; fix ownership of its data volume before it starts.
  tempo-init:
    profiles: ["observability"]
    image: grafana/tempo:2.6.0
    container_name: seaj_tempo_init
    user: root
    entrypoint: ["chown", "10001:10001", "/var/tempo"]
    volumes:
      - tempo_data:/var/tempo

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.6.0
    container_name: seaj_tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.2.0
    container_name: seaj_loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    container_name: seaj_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver   # Tempo pushes service-graph / span metrics here
      - --enable-feature=exemplar-storage    # metric -> trace jumps in Grafana
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "8085:9090"

  kafka-exporter:
    profiles: ["observability"]
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: seaj_kafka_exporter
    command: ["--kafka.server=kafka:9092"]
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.2.2
    container_name: seaj_grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "8084:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  pgdata_volume:
  sonarqube_data:
  sonarqube_logs:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
