services:
  db:
    build:
      context: ./infra/db
      dockerfile: Dockerfile
    container_name: seaj_postgres_db
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5433:5432"
    volumes:
      - pgdata_volume:/var/lib/postgresql/data

  app:
    build:
      context: app/backend/backend-java
      dockerfile: Dockerfile
    container_name: seaj_app
    ports:
      - "8081:8083"
    depends_on:
      - db
      - auth-stub
    environment:
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      JWT_SHARED_SECRET: "${JWT_SECRET}"

  auth-stub:
    build:
      context: app/backend/shared/auth-stub
      dockerfile: Dockerfile
    container_name: seaj_auth_stub
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: "${JWT_SECRET}"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: seaj_kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: seaj_kafka_ui
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  execution-engine:
    build:
      context: execution-engine
      dockerfile: Dockerfile
    container_name: seaj_execution_engine
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENGINE_MIN_DELAY: "${ENGINE_MIN_DELAY:-500ms}"
      ENGINE_MAX_DELAY: "${ENGINE_MAX_DELAY:-2000ms}"
      ENGINE_MAX_PRICE_IMPROVEMENT_BPS: "${ENGINE_MAX_PRICE_IMPROVEMENT_BPS:-50}"

  sonarqube:
    image: sonarqube:9.9-community
    container_name: seaj_sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  pgdata_volume:
  sonarqube_data:
  sonarqube_logs:
