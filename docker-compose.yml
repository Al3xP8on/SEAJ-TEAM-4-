# Defines the platform containers, networking, storage and runtime configuration.
# Builds the authentication service with its login page and shared API contract.
services:
  db:
    build:
      context: ./infra/db
      dockerfile: Dockerfile
    container_name: seaj_postgres_db
    mem_limit: 512m
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata_volume:/var/lib/postgresql/data

  app:
    build:
      context: app/backend/backend-java
      dockerfile: Dockerfile
    container_name: seaj_app
    mem_limit: 768m
    ports:
      - "8081:8083"
    depends_on:
      - db
      - auth-service
    environment:
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      JWT_SHARED_SECRET: "${JWT_SECRET}"
      ALPACA_ENABLED: "${ALPACA_ENABLED:-true}"
      ALPACA_API_KEY_ID: "${ALPACA_API_KEY_ID:-}"
      ALPACA_API_SECRET_KEY: "${ALPACA_API_SECRET_KEY:-}"
      ALPACA_DATA_FEED: "${ALPACA_DATA_FEED:-iex}"

  frontend:
    build:
      context: app/frontend/SEAJ-ui
      dockerfile: Dockerfile
    container_name: seaj_frontend
    mem_limit: 128m
    ports:
      - "8085:80"
    depends_on:
      - app
      - auth-service

  auth-service:
    build:
      context: .
      dockerfile: app/backend/backend-nestjs/Dockerfile
    container_name: seaj_auth_service
    mem_limit: 384m
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRY: "${JWT_EXPIRY:-1800}"
      JWT_REFRESH_EXPIRY: "${JWT_REFRESH_EXPIRY:-604800}"
      EMAIL_CODE_EXPIRY: "${EMAIL_CODE_EXPIRY:-300}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      FRONTEND_ORIGINS: "${FRONTEND_ORIGINS:-}"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      DB_NAME: "${POSTGRES_DB}"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: seaj_kafka
    mem_limit: 768m
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${REMOTE_HOST:-localhost}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: seaj_kafka_ui
    mem_limit: 384m
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  execution-engine:
    build:
      context: execution-engine
      dockerfile: Dockerfile
    container_name: seaj_execution_engine
    mem_limit: 512m
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  sonarqube:
    image: sonarqube:9.9-community
    container_name: seaj_sonarqube
    mem_limit: 2g
    ports:
      - "8088:9000" 
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - sonar.search.javaAdditionalOpts=-Xmx512m -Xms512m -XX:MaxDirectMemorySize=256m
      - ES_JAVA_OPTS=-Des.cluster.routing.allocation.disk.watermark.low=97% -Des.cluster.routing.allocation.disk.watermark.high=98% -Des.cluster.routing.allocation.disk.watermark.flood_stage=99%
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  pgdata_volume:
  sonarqube_data:
  sonarqube_logs:
