version: '3.8'

services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
      args:
        SCHEMA_PATH: db/seaj-db.sql
    container_name: seaj_postgres_db
    environment:
      POSTGRES_PASSWORD: "n3u3d4!"
      POSTGRES_DB: "SEAJ_db_DEMO"
    ports:
      - "5432:5432"
    volumes:
      - pgdata_volume:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seaj_app
    ports:
      - "8081:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/SEAJ_db_DEMO
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "n3u3d4!"

volumes:
  pgdata_volume: