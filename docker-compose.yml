version: '3.9'

services:
  # Single unified application container
  # Contains: Account Service, Order Service, Positions Service, API Gateway
  app:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: seaj_unified_app
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-SEAJ_db_DEMO}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-SEAJ_db_DEMO}
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
    volumes:
      - ./app/backend/logs:/app/logs
    networks:
      - seaj-network
    restart: unless-stopped

  # Single PostgreSQL database (shared by all services)
  db:
    build:
      context: .
      dockerfile: infra/db/Dockerfile
    container_name: seaj_postgres_db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-SEAJ_db_DEMO}"
    volumes:
      - pgdata_volume:/var/lib/postgresql/data
    networks:
      - seaj-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata_volume:
    driver: local

networks:
  seaj-network:
    driver: bridge
