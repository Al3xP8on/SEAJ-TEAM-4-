<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAJ Capital - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #316442 0%, #316442 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 2rem;
            text-align: center;
        }

        header h1 {
            color: white;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            background: white;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-container h2 {
            color: #333;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
            cursor: pointer;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #316442;
            box-shadow: 0 0 0 3px rgba(49, 100, 66, 0.1);
        }

        .form-group input:invalid:not(:placeholder-shown) {
            border-color: #e74c3c;
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #316442 0%, #316442 100%);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(49, 100, 66, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #316442;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 1rem;
            text-decoration: underline;
            padding: 0;
            width: 100%;
        }

        .toggle-btn:hover {
            color: #1f3d28;
        }

        #loginMessage {
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            min-height: 1.2em;
        }

        #registerMessage {
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            min-height: 1.2em;
        }

        #loginMessage.error { color: #e74c3c; }
        #loginMessage.success { color: #316442; }
        #registerMessage.error { color: #e74c3c; }
        #registerMessage.success { color: #316442; }

        footer {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        footer p {
            color: white;
            font-size: 0.9rem;
            font-style: italic;
        }
    </style>
</head>
<body>
    <header>
        <h1>SEAJ Capital</h1>
    </header>

    <main>
        <div class="login-container">
            <!-- LOGIN FORM -->
            <div id="loginDiv">
                <h2>Login</h2>
                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" required minlength="3" maxlength="100" autocomplete="username" placeholder="Enter your username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required minlength="1" autocomplete="current-password" placeholder="Enter your password">
                    </div>
                    <p id="loginMessage" role="status"></p>
                    <button type="submit" class="submit-btn">Login</button>
                </form>
                <button class="toggle-btn" onclick="showRegister()">New Customer?</button>
            </div>

            <!-- REGISTER FORM -->
            <div id="registerDiv" style="display:none;">
                <h2>Create Account</h2>
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" required minlength="3" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required minlength="8" autocomplete="new-password" placeholder="Enter a strong password">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" required placeholder="your@email.com">
                </div>
                <p id="registerMessage" role="status"></p>
                <button id="registerButton" class="submit-btn" onclick="submitRegister()">Create Account</button>
                <button class="toggle-btn" onclick="showLogin()">Back to Login</button>
            </div>
            <div id="verificationDiv" style="display:none;">
                <h2>Verify your email</h2>
                <p id="verificationMessage" role="status"></p>
                <form id="verificationForm" novalidate>
                    <div class="form-group">
                        <label for="verificationCode">Six-digit verification code</label>
                        <input id="verificationCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
                    </div>
                    <button id="verifyButton" type="submit" class="submit-btn">Verify code</button>
                </form>
                <button class="toggle-btn" onclick="cancelVerification()">Cancel and start again</button>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 SEAJ Capital. All rights reserved.</p>
    </footer>

    <script src="auth-service.js"></script>
    <script src="script.js"></script>
</body>
</html>
