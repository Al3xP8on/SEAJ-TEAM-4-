server.port=${SERVER_PORT:8083}
server.servlet.context-path=/api/

logging.config=classpath:logback-spring.xml
logging.level.root=INFO
logging.level.com.neueda.leap=INFO

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080,http://127.0.0.1:4200,http://127.0.0.1:8080}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Content-Type,Accept}
app.cors.max-age=${CORS_MAX_AGE:3600}

app.csrf.enabled=${CSRF_ENABLED:true}

spring.jackson.serialization.indent-output=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Dublin

app.environment=${ENVIRONMENT:development}

spring.datasource.url=jdbc:postgresql://localhost:5433/SEAJ_db
spring.datasource.username=postgres
spring.datasource.password=n3u3d4!
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# MyBatis Configuration
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true