# SEAJ Trading Platform - Unified Application
# Spring Boot Configuration

spring.application.name=seaj-trading-platform
server.port=8080

# Database Configuration - Shared PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:SEAJ_db_DEMO}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.neueda.leap=DEBUG
logging.level.org.springframework.web=DEBUG
logging.file.name=logs/app.log
logging.file.max-size=10MB
logging.file.max-history=30

# Actuator - Health Check Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Service Identification
service.name=SEAJ Trading Platform
service.version=0.1.0
service.environment=${ENVIRONMENT:development}
