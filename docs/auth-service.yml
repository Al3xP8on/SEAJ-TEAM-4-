# Defines the canonical authentication API contract for registration, email verification and sessions.
# Documents request/response schemas, shared errors and JWT protection for Swagger and contract tests.
openapi: 3.0.3
info:
  title: SEAJ Authentication Service
  version: 1.0.0
  description: >-
    Username/password login requires a fresh email verification code before
    issuing tokens. Registration requires unique username/email and email
    verification before creating an account. Codes are single-use, expire after
    EMAIL_CODE_EXPIRY seconds (default 300), allow five attempts, and issuance
    is limited to one per minute/five per hour per recipient and purpose. New
    account IDs use the merged generator: ACC- followed by the first eight UUID
    characters in uppercase. Existing identifiers are preserved. JWT_EXPIRY
    defaults to 1800 seconds; refresh tokens rotate. Java resource servers
    validate JWTs locally.
paths:
  /auth/register:
    post:
      operationId: register
      summary: Start registration and send email verification code
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /auth/login:
    post:
      operationId: login
      summary: Verify username/password and send email verification code
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate a valid refresh token
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the session identified by a refresh token
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
  /auth/validate:
    get:
      operationId: validate
      summary: Validate an access JWT and active session
      tags:
        - auth
      security:
        - JWT: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          $ref: '#/components/responses/Error401'
  /auth/me:
    get:
      operationId: me
      summary: 'Sample protected route: current active user'
      tags:
        - auth
      security:
        - JWT: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /auth/register/verify:
    post:
      operationId: verifyRegistration
      summary: Verify email and create account with generated account ID
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'
  /auth/login/verify:
    post:
      operationId: verifyLogin
      summary: Complete email second factor and issue session tokens
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
components:
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Maximum 72 UTF-8 bytes (bcrypt limit).
        username:
          type: string
          minLength: 3
          maxLength: 100
          description: Required unique username used to log in.
        name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: string
          minLength: 7
          maxLength: 20
          pattern: '^(?=.{7,20}$)\+?[0-9 ()-]+$'
          example: '+353-85-456-7891'
          description: Optional contact number stored on the account; must be unique. Not used for verification.
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 72
          description: Maximum 72 UTF-8 bytes.
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 256
    AuthResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - refresh_token
        - expires_in
        - token_type
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          minimum: 1
        token_type:
          type: string
          enum:
            - Bearer
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - username
        - name
        - role
        - account_id
        - email_verified
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
            - USER
            - ADMIN
        account_id:
          type: string
          description: >-
            Generated using ACC- plus the first eight UUID characters in
            uppercase, e.g. ACC-7A3F91C2. Existing identifiers are preserved.
        email_verified:
          type: boolean
    ValidationResponse:
      type: object
      additionalProperties: false
      required:
        - valid
        - sub
        - role
      properties:
        valid:
          type: boolean
          enum:
            - true
        sub:
          type: string
        role:
          type: string
          enum:
            - USER
            - ADMIN
    LogoutResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          enum:
            - Logged out
    Error:
      type: object
      additionalProperties: false
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string
    ChallengeResponse:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - expires_in
        - message
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_in:
          type: integer
          minimum: 1
        message:
          type: string
    VerifyRequest:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - code
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[0-9]{6}$
  responses:
    Error400:
      description: Invalid payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Invalid credentials or token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Account is not active
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Email or username already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: Verification request rate limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: SMTP verification unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
