openapi: 3.0.0
info:
  title: Account Service API
  description: |
    REST API for managing trading accounts, balances, positions, and order history.
    This service provides core account management functionality for the SEAJ trading platform.
  version: 1.0.0
  contact:
    name: SEAJ Team
    email: support@seaj.local
  license:
    name: Internal Use Only
    url: https://seaj.local/license

servers:
  - url: https://api.seaj.local/account-service
    description: Production API
  - url: http://localhost:8080
    description: Local development server

security:
  - BearerAuth: []

tags:
  - name: Accounts
    description: Account management and retrieval
  - name: Balances
    description: Account cash balance operations
  - name: Positions
    description: Account holdings and positions

paths:
  /accounts/{accountId}:
    get:
      operationId: getAccount
      tags:
        - Accounts
      summary: Retrieve an account by ID
      description: |
        Retrieves a complete account object including account ID, holder name, 
        cash balance, and status information.
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Account found and returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{accountId}/balance:
    get:
      operationId: getBalance
      tags:
        - Balances
      summary: Get account cash balance
      description: |
        Returns the current cash balance (in GBP or USD depending on account currency) 
        for the specified account. Balance is returned as a decimal number.
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Balance retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: number
                    format: decimal
                    example: 10000.00
                    description: Current cash balance
        '401':
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{accountId}/exists:
    get:
      operationId: accountExists
      tags:
        - Accounts
      summary: Check if account exists
      description: Returns a boolean indicating whether an account exists in the system.
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Account existence check completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                    example: true
                    description: Whether the account exists
        '401':
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{accountId}/positions:
    get:
      operationId: getPositions
      tags:
        - Positions
      summary: Get account positions
      description: |
        Retrieves all current positions (holdings) for the specified account.
        **NOTE: This endpoint is not yet implemented and will return an error.**
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Positions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positions'
        '401':
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Feature not yet implemented - requires database integration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts:
    post:
      operationId: addAccount
      tags:
        - Accounts
      summary: Create a new account
      description: |
        Creates a new trading account with the provided details. The account will
        be initialized with a zero cash balance and ACTIVE status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Invalid account data - missing or invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Account already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token for authentication. Include the token in the Authorization header.

  schemas:
    Account:
      type: object
      required:
        - id
        - accountId
        - holderName
        - cashBalance
        - status
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: Internal database ID
        accountId:
          type: string
          example: "ACC-0001"
          description: Public account identifier
        holderName:
          type: string
          example: "Alice Johnson"
          description: Name of the account holder
        cashBalance:
          type: number
          format: decimal
          example: 10000.00
          description: Current cash balance in account currency
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - CLOSED
          example: ACTIVE
          description: Current status of the account
        lastUpdated:
          type: string
          format: date-time
          example: "2026-09-22T10:30:00Z"
          description: Timestamp of last account modification

    AccountInput:
      type: object
      required:
        - id
        - accountId
        - holderName
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: Internal database ID
        accountId:
          type: string
          example: "ACC-0006"
          description: Public account identifier (must be unique)
        holderName:
          type: string
          example: "Frank Smith"
          description: Name of the account holder
        cashBalance:
          type: number
          format: decimal
          example: 5000.00
          description: Initial cash balance (optional, defaults to 0)

    Position:
      type: object
      required:
        - symbol
        - quantity
        - averageCost
      properties:
        symbol:
          type: string
          example: "AAPL"
          description: Trading symbol of the instrument
        quantity:
          type: integer
          example: 100
          description: Number of units held
        averageCost:
          type: number
          format: decimal
          example: 150.25
          description: Average cost per unit
        costBasis:
          type: number
          format: decimal
          example: 15025.00
          description: Total cost basis (quantity × averageCost)
        currentPrice:
          type: number
          format: decimal
          example: 155.00
          description: Current market price
        marketValue:
          type: number
          format: decimal
          example: 15500.00
          description: Current market value (quantity × currentPrice)
        unrealizedPnL:
          type: number
          format: decimal
          example: 475.00
          description: Unrealized profit/loss

    Positions:
      type: object
      required:
        - accountId
        - positions
      properties:
        accountId:
          type: integer
          format: int64
          example: 1
          description: Account ID
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        totalCostBasis:
          type: number
          format: decimal
          description: Sum of all cost bases
        totalMarketValue:
          type: number
          format: decimal
          description: Sum of all market values
        totalUnrealizedPnL:
          type: number
          format: decimal
          description: Total unrealized profit/loss

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: "NOT_FOUND"
          description: Error code
        message:
          type: string
          example: "Account with ID 999 not found"
          description: Detailed error message
        timestamp:
          type: string
          format: date-time
          example: "2026-09-22T10:30:00Z"
          description: Timestamp when error occurred
        status:
          type: integer
          example: 404
          description: HTTP status code