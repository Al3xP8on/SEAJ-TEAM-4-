paths:
  /accounts/{accountId}:
    get:
      operationId: getAccount
      tags:
        - Accounts
      summary: Retrieve an account by ID
      description: |
        Retrieves a complete account object including account ID, holder name, 
        cash balance, and status information.
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Account found and returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: './shared-schemas.yml#/components/responses/UnauthorizedError'
        '403':
          $ref: './shared-schemas.yml#/components/responses/ForbiddenError'
        '404':
          $ref: './shared-schemas.yml#/components/responses/NotFoundError'
        '500':
          $ref: './shared-schemas.yml#/components/responses/InternalServerError'

  /accounts/{accountId}/balance:
    get:
      operationId: getBalance
      tags:
        - Balances
      summary: Get account cash balance
      description: |
        Returns the current cash balance (in GBP or USD depending on account currency) 
        for the specified account. Balance is returned as a decimal number.
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Balance retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: number
                    format: decimal
                    example: 10000.00
                    description: Current cash balance
        '401':
          $ref: './shared-schemas.yml#/components/responses/UnauthorizedError'
        '403':
          $ref: './shared-schemas.yml#/components/responses/ForbiddenError'
        '404':
          $ref: './shared-schemas.yml#/components/responses/NotFoundError'
        '500':
          $ref: './shared-schemas.yml#/components/responses/InternalServerError'

  /accounts/{accountId}/exists:
    get:
      operationId: accountExists
      tags:
        - Accounts
      summary: Check if account exists
      description: Returns a boolean indicating whether an account exists in the system.
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Account existence check completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                    example: true
                    description: Whether the account exists
        '401':
          $ref: './shared-schemas.yml#/components/responses/UnauthorizedError'
        '403':
          $ref: './shared-schemas.yml#/components/responses/ForbiddenError'

