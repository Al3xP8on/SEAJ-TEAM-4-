              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: './shared-schemas.yml#/components/responses/BadRequestError'
        '401':
          $ref: './shared-schemas.yml#/components/responses/UnauthorizedError'
        '403':
          $ref: './shared-schemas.yml#/components/responses/ForbiddenError'
        '409':
          $ref: './shared-schemas.yml#/components/responses/ConflictError'
        '500':
          $ref: './shared-schemas.yml#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token for authentication. Include the token in the Authorization header.

  schemas:
    Account:
      type: object
      required:
        - id
        - accountId
        - holderName
        - cashBalance
        - status
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: Internal database ID
        accountId:
          type: string
          example: "ACC-0001"
          description: Public account identifier
        holderName:
          type: string
          example: "Alice Johnson"
          description: Name of the account holder
        cashBalance:
          type: number
          format: decimal
          example: 10000.00
          description: Current cash balance in account currency
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - CLOSED
          example: ACTIVE
          description: Current status of the account
        lastUpdated:
          type: string
          format: date-time
          example: "2026-09-22T10:30:00Z"
          description: Timestamp of last account modification

    AccountInput:
      type: object
      required:
        - id
        - accountId
        - holderName
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: Internal database ID
        accountId:
          type: string
          example: "ACC-0006"
          description: Public account identifier (must be unique)
        holderName:
          type: string
          example: "Frank Smith"
          description: Name of the account holder
        cashBalance:
          type: number
          format: decimal
          example: 5000.00
          description: Initial cash balance (optional, defaults to 0)

