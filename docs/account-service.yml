  /accounts:
    post:
      operationId: addAccount
      tags:
        - Accounts
      summary: Create a new account
      description: |
        Creates a new trading account with the provided details. The account will
        be initialized with a zero cash balance and ACTIVE status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '201':
          description: Account created successfully
          content:
